<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="Pyramid buddy">
  <title>Pyramid buddy</title>
  <!-- TPC learner companion. The brand mark is a stepped pyramid, so the mascot
       IS the logo with a face. Each tier is three quads that SHARE their
       vertices exactly — no rx on the front plane against a sharp top/side
       (穿崩位 / 為圓角而圓角). Geometry matches src/admin/design/PyramidBuddy.jsx.
       Grain at full strength (amp 0.1 × GRAIN_GAIN 6): a character, not content. -->
  <defs>
    <linearGradient id="pbFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FA47D"/>
      <stop offset="1" stop-color="#2E8B6B"/>
    </linearGradient>
    <radialGradient id="pbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8FE3C4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8FE3C4" stop-opacity="0"/>
    </radialGradient>
    <filter id="pbGrain" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
      <feComponentTransfer in="grey" result="grain">
        <feFuncR type="linear" slope="0.6" intercept="0.65"/>
        <feFuncG type="linear" slope="0.6" intercept="0.65"/>
        <feFuncB type="linear" slope="0.6" intercept="0.65"/>
        <feFuncA type="table" tableValues="1 1"/>
      </feComponentTransfer>
      <feComposite in="grain" in2="SourceGraphic" operator="in" result="clipped"/>
      <feBlend in="clipped" in2="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>

  <ellipse cx="112" cy="196" rx="74" ry="12" fill="#0E3C2C" opacity=".16"/>
  <circle cx="110" cy="110" r="98" fill="url(#pbGlow)"/>

  <!-- bottom / middle / top tiers under gained grain -->
  <g filter="url(#pbGrain)">
    <polygon points="34,158 174,158 190,142 50,142" fill="#5CC79C"/>
    <polygon points="174,158 190,142 190,172 174,188" fill="#1C6B51"/>
    <polygon points="34,158 174,158 174,188 34,188" fill="url(#pbFront)"/>

    <polygon points="54,124 154,124 170,108 70,108" fill="#5CC79C"/>
    <polygon points="154,124 170,108 170,138 154,154" fill="#1C6B51"/>
    <polygon points="54,124 154,124 154,154 54,154" fill="url(#pbFront)"/>

    <polygon points="74,90 134,90 150,74 90,74" fill="#5CC79C"/>
    <polygon points="134,90 150,74 150,104 134,120" fill="#1C6B51"/>
    <polygon points="74,90 134,90 134,120 74,120" fill="url(#pbFront)"/>
  </g>

  <!-- face sits on the middle tier: the widest front plane at eye height -->
  <g fill="#123C2E">
    <circle cx="86" cy="136" r="5.4"/>
    <circle cx="122" cy="136" r="5.4"/>
    <path d="M92 145 Q104 154 116 145" fill="none" stroke="#123C2E" stroke-width="4.4" stroke-linecap="round"/>
  </g>
  <circle cx="70" cy="145" r="6.5" fill="#F08A6A" opacity=".5"/>
  <circle cx="138" cy="145" r="6.5" fill="#F08A6A" opacity=".5"/>

  <!-- spark echoes the 今日建議 eyebrow icon -->
  <path d="M178 52 l4.5 11 11 4.5 -11 4.5 -4.5 11 -4.5 -11 -11 -4.5 11 -4.5 z" fill="#F5C451"/>
</svg>
